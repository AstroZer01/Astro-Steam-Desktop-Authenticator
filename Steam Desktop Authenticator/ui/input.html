<!DOCTYPE html><html class="dark" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Astro SDA — Input</title>
<link href="assets/css/app.css" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    background: linear-gradient(180deg, #101727 0%, #0d1320 40%);
    color: #e4eaf4;
    font-family: "Inter", "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
  }
  .input-panel {
    padding: 22px 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 15px;
  }
  .field-input {
    width: 100%;
    background: #090e19 !important;
    color: #e4eaf4 !important;
    border: 1px solid rgba(255, 255, 255, 0.14) !important;
    border-radius: 8px !important;
    padding: 10px 13px !important;
    font-size: 13px !important;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .field-input:focus {
    border-color: #4cc3d9 !important;
    box-shadow: 0 0 0 2px rgba(76, 195, 217, 0.14) !important;
  }
  .field-input.code-mode {
    text-align: center;
    font-family: "JetBrains Mono", "Cascadia Code", "Consolas", monospace;
    font-size: 20px !important;
    font-weight: 700;
    letter-spacing: 0.28em;
    color: #f5f8fc !important;
  }
  .password-field { position: relative; }
  .password-field .field-input { padding-right: 44px !important; }
  .password-toggle {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    border: 0;
    background: transparent;
    color: #96a4b8;
    padding: 6px;
    line-height: 0;
    cursor: pointer;
    border-radius: 6px;
  }
  .password-toggle:hover, .password-toggle:focus { color: #85d6e6; }
  .password-toggle:focus-visible { outline: 2px solid #4cc3d9; outline-offset: 2px; }
  .password-toggle svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  input::-ms-reveal { display: none; }
  .input-foot {
    padding-top: 14px;
    border-top: 1px solid rgba(255, 255, 255, 0.075);
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }
</style>
</head>
<body>
<div class="input-panel">
  <div>
    <h1 id="dialog-heading" class="text-base font-bold text-[#f3f6fb]">Input Required</h1>
    <p id="label-text" class="text-xs text-[#96a4b8] mt-1.5 leading-relaxed">Please enter the required information.</p>
  </div>

  <div id="password-field" class="password-field">
    <input type="password" id="input-box" class="field-input" aria-labelledby="label-text" placeholder="Enter value…" disabled />
    <button id="password-toggle" class="password-toggle" type="button" aria-label="Show password" aria-pressed="false" style="display: none;">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg>
    </button>
  </div>

  <div class="input-foot">
    <button id="btn-cancel" type="button" class="btn-ghost rounded-lg px-4 py-2 text-xs" disabled>Cancel</button>
    <button id="btn-accept" type="button" class="btn-primary rounded-lg px-5 py-2 text-xs" disabled>Confirm</button>
  </div>
</div>

<script>
  document.getElementById('btn-accept').addEventListener('click', () => {
    const input = document.getElementById('input-box');
    if (input.disabled) return;
    let val = input.value;
    window.chrome.webview.postMessage({ action: 'accept', value: val });
  });

  document.getElementById('btn-cancel').addEventListener('click', () => {
    const cancelButton = document.getElementById('btn-cancel');
    if (cancelButton.disabled) return;
    window.chrome.webview.postMessage({ action: 'cancel' });
  });

  document.getElementById('input-box').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !this.disabled) {
      e.preventDefault();
      document.getElementById('btn-accept').click();
    } else if (e.key === 'Escape') {
      e.preventDefault();
      document.getElementById('btn-cancel').click();
    }
  });

  const resizeObserver = new ResizeObserver(entries => {
    for (let entry of entries) {
      let h = Math.ceil(entry.target.offsetHeight) + 6;
      window.chrome.webview.postMessage({ action: 'resize', height: h });
    }
  });

  function setupInput(label, isPassword) {
    const text = String(label || '');
    document.getElementById('label-text').innerText = text;
    const heading = document.getElementById('dialog-heading');
    const input = document.getElementById('input-box');
    const cancelButton = document.getElementById('btn-cancel');
    const acceptButton = document.getElementById('btn-accept');
    const toggle = document.getElementById('password-toggle');
    const passwordField = document.getElementById('password-field');
    const panel = document.querySelector('.input-panel');

    const lower = text.toLowerCase();
    const isCodePrompt = !isPassword && (lower.includes('code') || lower.includes('sms') || lower.includes('email'));
    if (isPassword) {
      heading.innerText = lower.includes('passkey') ? 'Enter Vault Passkey' : 'Password Required';
      acceptButton.innerText = lower.includes('unlock') || lower.includes('current') ? 'Unlock' : 'Confirm';
      input.placeholder = 'Enter passkey…';
    } else if (isCodePrompt) {
      heading.innerText = 'Enter Verification Code';
      acceptButton.innerText = 'Verify Code';
      input.placeholder = 'XXXXX';
    } else {
      heading.innerText = 'Input Required';
      acceptButton.innerText = 'Confirm';
      input.placeholder = 'Enter value…';
    }

    input.type = isPassword ? 'password' : 'text';
    input.classList.toggle('code-mode', isCodePrompt);
    passwordField.classList.toggle('password-field', isPassword);
    toggle.style.display = isPassword ? 'block' : 'none';
    toggle.setAttribute('aria-label', 'Show password');
    toggle.setAttribute('aria-pressed', 'false');
    resizeObserver.observe(panel);
    input.disabled = false;
    cancelButton.disabled = false;
    acceptButton.disabled = false;
    input.focus();
    return true;
  }

  document.getElementById('password-toggle').addEventListener('click', () => {
    const input = document.getElementById('input-box');
    const toggle = document.getElementById('password-toggle');
    const visible = input.type === 'password';
    input.type = visible ? 'text' : 'password';
    toggle.setAttribute('aria-label', visible ? 'Hide password' : 'Show password');
    toggle.setAttribute('aria-pressed', visible ? 'true' : 'false');
    input.focus();
  });
</script>
</body></html>
