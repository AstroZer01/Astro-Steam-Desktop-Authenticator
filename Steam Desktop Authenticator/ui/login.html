<!DOCTYPE html><html class="dark" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Astro SDA - Login</title>
<link href="assets/css/app.css" rel="stylesheet">
<style>
body { background-color: #0b1326; color: #dae2fd; font-family: 'Inter', sans-serif; overflow: hidden; }
.glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
input { background: #131B2E !important; color: white !important; border: 1px solid rgba(255, 255, 255, 0.2) !important; border-radius: 8px !important; padding: 12px !important; width: 100%; outline: none; transition: border-color 0.2s; }
input:focus { border-color: #00daf3 !important; }
.password-field { position: relative; }
.password-field input { padding-right: 48px !important; }
.password-toggle { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); border: 0; background: transparent; color: #ffffff; padding: 6px; line-height: 0; cursor: pointer; }
.password-toggle:hover, .password-toggle:focus { color: #c3f5ff; outline: none; }
.password-toggle svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
input::-ms-reveal { display: none; }
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
<div class="absolute top-[-10%] right-[-10%] w-[40%] h-[40%] bg-[#00E5FF]/5 rounded-full blur-[120px] pointer-events-none"></div>

<div class="glass-panel w-full max-w-sm p-8 rounded-2xl flex flex-col gap-5 shadow-2xl relative z-10">
    <div class="flex flex-col items-center mb-2">
        <h1 class="text-2xl font-bold text-[#c3f5ff] text-center">Steam Login</h1>
        <p id="explanation-text" class="text-sm text-[#bac9cc] text-center mt-2 leading-relaxed">This will activate Astro Steam Desktop Assistant on your Steam account.</p>
    </div>
    
    <div class="flex flex-col gap-2">
        <label class="text-sm text-[#849396] font-medium" for="username">Username</label>
        <input type="text" id="username" placeholder="Steam Username" />
    </div>
    
    <div class="flex flex-col gap-2">
        <label class="text-sm text-[#849396] font-medium" for="password">Password</label>
        <div class="password-field">
            <input type="password" id="password" placeholder="Steam Password" />
            <button id="password-toggle" class="password-toggle" type="button" aria-label="Show password" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg>
            </button>
        </div>
    </div>

    <button id="btn-login" class="mt-4 bg-[#00E5FF] hover:bg-[#9cf0ff] text-[#00363D] font-bold py-3 rounded-lg w-full transition-colors shadow-lg shadow-[#00E5FF]/20">LOGIN</button>
</div>
<script>
    function submitLogin() {
        let u = document.getElementById('username').value;
        let p = document.getElementById('password').value;
        window.chrome.webview.postMessage({ action: 'login', user: u, pass: p });
    }

    document.getElementById('btn-login').addEventListener('click', submitLogin);
    document.getElementById('password-toggle').addEventListener('click', () => {
        const password = document.getElementById('password');
        const toggle = document.getElementById('password-toggle');
        const visible = password.type === 'password';
        password.type = visible ? 'text' : 'password';
        toggle.setAttribute('aria-label', visible ? 'Hide password' : 'Show password');
        toggle.setAttribute('aria-pressed', visible ? 'true' : 'false');
        password.focus();
    });
    document.getElementById('password').addEventListener('keydown', event => {
        if (event.key === 'Enter') {
            event.preventDefault();
            submitLogin();
        }
    });
    
    function setExplanation(text) {
        document.getElementById('explanation-text').innerText = text;
    }
    
    function setUsername(text, disable) {
        let u = document.getElementById('username');
        u.value = text;
        u.disabled = !!disable;
        u.style.opacity = disable ? '0.5' : '1';
    }
    
    function setButtonState(text, disabled) {
        let b = document.getElementById('btn-login');
        b.innerText = text;
        b.disabled = disabled;
        b.style.opacity = disabled ? '0.5' : '1';
    }
</script>
</body></html>
