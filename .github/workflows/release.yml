name: Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version Number (e.g. 1.2.0)'
        required: true
        default: '1.0.0'
      release_type:
        description: 'Release Type (Beta or Release)'
        required: true
        default: 'Release'
        type: choice
        options:
        - Release
        - Beta

permissions:
  contents: write

jobs:
  build_and_release:
    runs-on: windows-latest
    
    env:
      Solution_Name: SteamDesktopAuthenticator.sln

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install .NET Core
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 8.0.x

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v3

    - name: Restore the application
      run: msbuild $env:Solution_Name /t:Restore /p:Configuration=Release

    - name: Build the application
      run: msbuild $env:Solution_Name /p:Configuration=Release

    - name: Zip Build Output
      run: Compress-Archive -Path Launcher\bin\Release\net8.0-windows\* -DestinationPath ASDA-${{ github.event.inputs.release_type }}-${{ github.event.inputs.version }}.zip

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ github.event.inputs.version }}
        name: ASDA-${{ github.event.inputs.release_type }}-${{ github.event.inputs.version }}
        files: ASDA-${{ github.event.inputs.release_type }}-${{ github.event.inputs.version }}.zip
        draft: false
        prerelease: ${{ github.event.inputs.release_type == 'Beta' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
