name: Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Public release version (three components, e.g. 1.1.1)'
        required: true
        default: '1.1.1'
      release_type:
        description: 'Release Type (Beta or Release)'
        required: true
        default: 'Release'
        type: choice
        options:
        - Release
        - Beta
      release_notes:
        description: 'Optional Markdown release notes. In the Run workflow form, use \n for each new line.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build_and_release:
    runs-on: windows-latest
    
    env:
      Solution_Name: SteamDesktopAuthenticator.sln
      VERSION: ${{ github.event.inputs.version }}
      RELEASE_TYPE: ${{ github.event.inputs.release_type }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: npm

    - name: Install UI build dependencies
      run: npm ci

    - name: Install .NET Core
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 8.0.x

    - name: Generate and commit local UI assets
      run: |
        npm run build:ui
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add "Steam Desktop Authenticator\ui\assets\css\app.css"
        if (git diff --cached --quiet) {
            Write-Host "Local UI stylesheet is current."
        } else {
            git commit -m "Build local UI stylesheet"
            git push
        }

    - name: Update Version Numbers
      run: |
        $version = $env:VERSION
        if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Use a three-part public version number such as 1.1.1."
        }
        $applicationVersion = "$version.0"
        
        # Update .csproj
        $csprojPath = "Steam Desktop Authenticator\Steam Desktop Authenticator.csproj"
        $csprojContent = Get-Content $csprojPath
        $csprojContent = $csprojContent -replace "<ApplicationVersion>.*</ApplicationVersion>", "<ApplicationVersion>$applicationVersion</ApplicationVersion>"
        Set-Content -Path $csprojPath -Value $csprojContent

        # Update AssemblyInfo.cs
        $assemblyInfoPath = "Steam Desktop Authenticator\Properties\AssemblyInfo.cs"
        $assemblyInfoContent = Get-Content $assemblyInfoPath
        $assemblyInfoContent = $assemblyInfoContent -replace '\[assembly: AssemblyVersion\(".*"\)\]', "[assembly: AssemblyVersion(`"$version`")]"
        $assemblyInfoContent = $assemblyInfoContent -replace '\[assembly: AssemblyFileVersion\(".*"\)\]', "[assembly: AssemblyFileVersion(`"$version`")]"
        Set-Content -Path $assemblyInfoPath -Value $assemblyInfoContent

    - name: Commit Version Bump
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add "Steam Desktop Authenticator\Steam Desktop Authenticator.csproj" "Steam Desktop Authenticator\Properties\AssemblyInfo.cs"
        # Only commit if there are changes
        if (git diff --cached --quiet) {
            Write-Host "No version changes to commit."
        } else {
            git commit -m "Bump version to $env:VERSION"
            git push
        }

    - name: Clean and publish the release package
      run: |
        dotnet clean $env:Solution_Name -c Release
        dotnet publish "Steam Desktop Authenticator\Steam Desktop Authenticator.csproj" -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=false -p:PublishTrimmed=false -p:EnableCompressionInSingleFile=false -p:DebugSymbols=false -o publish\ASDA

        Remove-Item publish\ASDA\*.pdb, publish\ASDA\*.xml, publish\ASDA\*.config -Force -ErrorAction SilentlyContinue

        $requiredPaths = @(
          "publish\ASDA\Steam Desktop Authenticator.exe",
          "publish\ASDA\WebView2Loader.dll",
          "publish\ASDA\runtimes",
          "publish\ASDA\app\ui\index.html",
          "publish\ASDA\app\ui\login.html",
          "publish\ASDA\app\ui\input.html"
        )
        $missingPaths = $requiredPaths | Where-Object { -not (Test-Path $_) }
        if ($missingPaths) {
          throw "Release package is incomplete: $($missingPaths -join ', ')"
        }
        if (Test-Path publish\ASDA\bin) {
          throw "Release package unexpectedly contains the legacy launcher bin folder."
        }

    - name: Zip Build Output
      run: |
        $releaseAssetName = "ASDA-$env:RELEASE_TYPE-$env:VERSION.zip"
        Compress-Archive -Path publish\ASDA\* -DestinationPath $releaseAssetName

    - name: Prepare release notes
      env:
        RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
      run: |
        $notes = $env:RELEASE_NOTES -replace '(?<!\\)\\n', [Environment]::NewLine
        $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
        [System.IO.File]::WriteAllText($notesPath, $notes, [System.Text.UTF8Encoding]::new($false))

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ github.event.inputs.version }}
        name: ASDA-${{ github.event.inputs.release_type }}-${{ github.event.inputs.version }}
        files: ASDA-${{ github.event.inputs.release_type }}-${{ github.event.inputs.version }}.zip
        body_path: ${{ runner.temp }}\release-notes.md
        draft: false
        prerelease: ${{ github.event.inputs.release_type == 'Beta' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
