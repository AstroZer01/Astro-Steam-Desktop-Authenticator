name: Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version Number (e.g. 1.2.0)'
        required: true
        default: '1.0.0'
      release_type:
        description: 'Release Type (Beta or Release)'
        required: true
        default: 'Release'
        type: choice
        options:
        - Release
        - Beta

permissions:
  contents: write

jobs:
  build_and_release:
    runs-on: windows-latest
    
    env:
      Solution_Name: SteamDesktopAuthenticator.sln

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install .NET Core
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 8.0.x

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v3

    - name: Update Version Numbers
      run: |
        $version = "${{ github.event.inputs.version }}"
        
        # Update .csproj
        $csprojPath = "Steam Desktop Authenticator\Steam Desktop Authenticator.csproj"
        $csprojContent = Get-Content $csprojPath
        $csprojContent = $csprojContent -replace "<ApplicationVersion>.*</ApplicationVersion>", "<ApplicationVersion>$version.0</ApplicationVersion>"
        Set-Content -Path $csprojPath -Value $csprojContent

        # Update AssemblyInfo.cs
        $assemblyInfoPath = "Steam Desktop Authenticator\Properties\AssemblyInfo.cs"
        $assemblyInfoContent = Get-Content $assemblyInfoPath
        $assemblyInfoContent = $assemblyInfoContent -replace '\[assembly: AssemblyVersion\(".*"\)\]', "[assembly: AssemblyVersion(`"$version`")]"
        $assemblyInfoContent = $assemblyInfoContent -replace '\[assembly: AssemblyFileVersion\(".*"\)\]', "[assembly: AssemblyFileVersion(`"$version`")]"
        Set-Content -Path $assemblyInfoPath -Value $assemblyInfoContent

    - name: Commit Version Bump
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add "Steam Desktop Authenticator\Steam Desktop Authenticator.csproj" "Steam Desktop Authenticator\Properties\AssemblyInfo.cs"
        # Only commit if there are changes
        if (git diff --cached --quiet) {
            Write-Host "No version changes to commit."
        } else {
            git commit -m "Bump version to ${{ github.event.inputs.version }}"
            git push
        }

    - name: Restore the application
      run: msbuild $env:Solution_Name /t:Restore /p:Configuration=Release

    - name: Build and Publish the application
      run: dotnet publish Launcher\Launcher.csproj -c Release

    - name: Zip Build Output
      run: Compress-Archive -Path Launcher\bin\Release\net8.0-windows\publish\* -DestinationPath ASDA-${{ github.event.inputs.release_type }}-${{ github.event.inputs.version }}.zip

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ github.event.inputs.version }}
        name: ASDA-${{ github.event.inputs.release_type }}-${{ github.event.inputs.version }}
        files: ASDA-${{ github.event.inputs.release_type }}-${{ github.event.inputs.version }}.zip
        draft: false
        prerelease: ${{ github.event.inputs.release_type == 'Beta' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
